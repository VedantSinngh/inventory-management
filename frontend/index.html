<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body style="margin: 0; padding: 0; width: 100%; height: 100%;">
    <div id="root" style="width: 100%; height: 100%;">
      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #0a0a0f; font-family: 'Inter', sans-serif; color: #f0f0f8;">
        <div style="text-align: center;">
          <div id="loader-spinner" style="border: 3px solid #2E2E2E; border-top: 3px solid #FFFFFF; border-radius: 50%; width: 40px; height: 40px; margin: 0 auto; animation: spin 1s linear infinite;"></div>
          <p style="margin-top: 20px;">Initializing System...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Add animation keyframes dynamically to avoid Vite build proxy issue
      (function() {
        const style = document.createElement('style');
        style.type = 'text/css';
        style.innerHTML = '@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }';
        document.getElementsByTagName('head')[0].appendChild(style);
      })();
    </script>
  </body>
</html>
