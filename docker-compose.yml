# Docker Compose for Inventory Management System
# All services: MongoDB + Backend (Node/Express) + Frontend (React/Vite)
# Images pulled via insecure HTTP mirror to bypass ISP TLS restrictions

services:

  # ─────────────────────────────────────────────
  # MongoDB Database
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: inventory-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb
      MONGO_INITDB_ROOT_PASSWORD: mongodb_password_dev
      MONGO_INITDB_DATABASE: inventorySystem
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - inventory-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # Backend: Node.js / Express API
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongodb:mongodb_password_dev@mongodb:27017/inventorySystem?authSource=admin
      JWT_SECRET: dev-secret-key-min-32-chars-1234567890abcdef
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      SOCKET_IO_CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: test_user@gmail.com
      SMTP_PASS: test_pass
      EMAIL_FROM: noreply@inventory-system.com
      MAPS_PROVIDER: osm
      LLM_PROVIDER: groq
      LLM_API_KEY: gsk_test_api_key_placeholder
      LLM_MODEL: llama-3.3-70b-versatile
      LLM_ENDPOINT: https://api.groq.com/openai/v1
      LOG_LEVEL: info
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - inventory-network
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: curl -f http://localhost:5000/api/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────
  # Frontend: React / Vite (served via Node serve)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    container_name: inventory-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - inventory-network
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:3000/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ─────────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────────
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  backend_logs:
    driver: local

# ─────────────────────────────────────────────
# Network
# ─────────────────────────────────────────────
networks:
  inventory-network:
    driver: bridge
